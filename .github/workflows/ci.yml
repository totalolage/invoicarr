name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || 'team_kvitbit' }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-check-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-check-
            ${{ runner.os }}-turbo-
      - run: bun install --frozen-lockfile
      - run: bunx turbo run //#check:bun-nix
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run crapload
      - run: bun run typecheck
      - run: bun test ./scripts
      - name: Lint rule fixtures and workspace tests
        run: bun run test --concurrency=2

  static-mounts:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kvitbit
          POSTGRES_PASSWORD: kvitbit
          POSTGRES_DB: kvitbit_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvitbit -d kvitbit_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build web and Expo PWA
        run: bun run build
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Install Chromium for the production server
        working-directory: apps/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx --no-install playwright install-deps chromium
          else
            bunx --no-install playwright install --with-deps chromium
          fi
          chromium_path="$(bun -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          printf 'KVITBIT_CHROMIUM_PATH=%s\n' "$chromium_path" >> "$GITHUB_ENV"
      - name: Smoke-test both builds on the production server
        run: bun run test:static-mounts
        env:
          KVITBIT_SMOKE_DATABASE_URL: postgres://kvitbit:kvitbit@127.0.0.1:5432/kvitbit_smoke

  # Bounded TLC models with their mutants, trace-replay harnesses and covered-file digests
  # (docs/adr/0005-formal-verification.md). A TLC timeout or incomplete search fails the job.
  formal:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: formal/.cache/tla2tools-*.jar
          key: formal-toolchain-${{ hashFiles('formal/toolchain/toolchain.json') }}
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-formal-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-formal-
            ${{ runner.os }}-turbo-
      - run: bun install --frozen-lockfile
      # Runs the digest gate and still runs every check, so drifted code is checked too.
      - name: Formal checks and covered-file digests
        run: bun run verify:formal:cached -- --continue

  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contention: ${{ steps.filter.outputs.contention }}
    steps:
      # Full history: on push, paths-filter diffs against the previous SHA locally, and
      # persist-credentials: false leaves it no way to fetch that commit later.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contention:
              - 'packages/core/src/store/**'
              - 'packages/core/src/shared/**'
              - 'packages/core/src/modules/numbering/**'
              - 'packages/core/src/modules/payments/**'
              - 'packages/core/src/modules/documents/**'
              - 'packages/core/src/modules/recurring/**'
              - 'packages/adapters/src/sql/**'
              - 'packages/adapters/test/sql/contention.postgres.test.ts'
              - 'packages/db/**'
              - '**/*.contention.ts'
              - '.github/workflows/ci.yml'

  # Run the adapter's lock and deadlock tests and discover any additional explicit
  # *.contention.ts suites for the Postgres-only cases in ADR-0005.
  pg-contention:
    needs: changes
    if: needs.changes.outputs.contention == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kvitbit
          POSTGRES_PASSWORD: kvitbit
          POSTGRES_DB: kvitbit_contention
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvitbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KVITBIT_CONTENTION_PG_URL: postgres://kvitbit:kvitbit@localhost:5432/kvitbit_contention
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Postgres 17 adapter contention tests
        run: bun test ./packages/adapters/test/sql/contention.postgres.test.ts
        env:
          DATABASE_URL: ${{ env.KVITBIT_CONTENTION_PG_URL }}
      - name: Additional Postgres 17 contention suites
        run: |
          mapfile -t files < <(git ls-files '*.contention.ts')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No additional *.contention.ts suites found."
            exit 0
          fi
          bun test "${files[@]/#/./}"
