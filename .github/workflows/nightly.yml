name: Nightly

permissions:
  contents: read

# Wider TLC bounds and the E2E suites that PR CI does not run (docs/adr/0005-formal-verification.md).
# main deploys without waiting for this workflow; a failure here is post-merge exposure to fix.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || 'team_kvitbit' }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  formal-wide:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        with:
          path: formal/.cache/tla2tools-*.jar
          key: formal-toolchain-${{ hashFiles('formal/toolchain/toolchain.json') }}
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-nightly-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-nightly-
            ${{ runner.os }}-turbo-
      - run: bun install --frozen-lockfile
      - run: bun run verify:formal:wide:cached -- --continue
      # Property/exhaustive tests gate their wider bounds on KVITBIT_FORMAL_WIDE=1 (ADR-0005).
      - run: bun run test
        env:
          KVITBIT_FORMAL_WIDE: "1"

  pg-contention:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kvitbit
          POSTGRES_PASSWORD: kvitbit
          POSTGRES_DB: kvitbit_contention
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvitbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KVITBIT_CONTENTION_PG_URL: postgres://kvitbit:kvitbit@localhost:5432/kvitbit_contention
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Postgres 17 adapter contention tests
        run: bun test ./packages/adapters/test/sql/contention.postgres.test.ts
        env:
          DATABASE_URL: ${{ env.KVITBIT_CONTENTION_PG_URL }}
      - name: Additional Postgres 17 contention suites
        run: |
          mapfile -t files < <(git ls-files '*.contention.ts')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No additional *.contention.ts suites found."
            exit 0
          fi
          bun test "${files[@]/#/./}"

  e2e-web:
    name: e2e-web (Playwright)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - working-directory: apps/web
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx --no-install playwright install-deps chromium
          else
            bunx --no-install playwright install --with-deps chromium
          fi
      - name: Playwright web journeys and hydration
        run: bun run --cwd apps/web e2e

  # These guards fail when the app exists and its E2E suite has yet to be wired.
  e2e-mobile:
    name: e2e-mobile (Expo, SKELETON)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Expo mobile journeys
        run: |
          if [ ! -d apps/mobile ]; then
            echo "::notice::apps/mobile does not exist yet; Expo E2E is a skeleton (ADR-0005)."
            exit 0
          fi
          echo "::error::apps/mobile exists; replace this step with the Expo suite (ADR-0005)."
          exit 1

  e2e-oauth-providers:
    name: e2e-oauth-providers (OAuth, SMTP, GCS, SKELETON)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OAuth grants and external provider integration
        run: |
          if [ ! -d apps/server ]; then
            echo "::notice::apps/server does not exist yet; OAuth/provider E2E is a skeleton (ADR-0005)."
            exit 0
          fi
          echo "::error::apps/server exists; replace this step with the OAuth/provider suite (ADR-0005)."
          exit 1

  e2e-cluster-pgbouncer:
    name: e2e-cluster-pgbouncer (Cluster runner, PgBouncer, SKELETON)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cluster workflow runs behind PgBouncer
        run: |
          if [ ! -d apps/server ]; then
            echo "::notice::apps/server does not exist yet; Cluster/PgBouncer E2E is a skeleton (ADR-0005)."
            exit 0
          fi
          echo "::error::apps/server exists; replace this step with the Cluster/PgBouncer suite (ADR-0005)."
          exit 1
