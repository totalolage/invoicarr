name: Deploy Kvitbit (GCP Alchemy)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - assets/**
      - infra/alchemy/**
      - Dockerfile
      - docker/**
      - .dockerignore
      - .github/workflows/deploy.yml
      - package.json
      - bun.lock
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only (skip image push, DB migration, and live rollout)
        type: boolean
        default: false
      bootstrap_foundation:
        description: Bootstrap foundation only (Artifact Registry, GCS buckets, service accounts, empty Secret Manager containers, log exclusion)
        type: boolean
        default: false
      bootstrap_feedback_secret:
        description: Create the feedback token container after enabling the feedback secret flag
        type: boolean
        default: false
      bootstrap_altcha_secret:
        description: Create the ALTCHA HMAC key secret container after enabling the ALTCHA secret flag
        type: boolean
        default: false
      bootstrap_resend_secret:
        description: Create the Resend API key container after enabling the Resend secret flag
        type: boolean
        default: false
      bootstrap_turbo_cache_secret:
        description: Create the Turborepo remote cache token container after enabling KVITBIT_ENABLE_TURBO_CACHE
        type: boolean
        default: false

# Never cancel an active production deployment or migration in progress.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (prod)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      KVITBIT_STAGE: prod
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      BOOTSTRAP_FOUNDATION: ${{ inputs.bootstrap_foundation && 'true' || 'false' }}
      BOOTSTRAP_FEEDBACK_SECRET: ${{ inputs.bootstrap_feedback_secret && 'true' || 'false' }}
      BOOTSTRAP_ALTCHA_SECRET: ${{ inputs.bootstrap_altcha_secret && 'true' || 'false' }}
      BOOTSTRAP_RESEND_SECRET: ${{ inputs.bootstrap_resend_secret && 'true' || 'false' }}
      BOOTSTRAP_TURBO_CACHE_SECRET: ${{ inputs.bootstrap_turbo_cache_secret && 'true' || 'false' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      ALCHEMY_STATE_BUCKET: ${{ vars.ALCHEMY_STATE_BUCKET }}
      KVITBIT_ENABLE_RESEND_SECRET: ${{ vars.KVITBIT_ENABLE_RESEND_SECRET }}
      KVITBIT_ENABLE_SMTP_SECRET: ${{ vars.KVITBIT_ENABLE_SMTP_SECRET }}
      KVITBIT_ENABLE_MOBILE_SIGNING_KEY_SECRET: ${{ vars.KVITBIT_ENABLE_MOBILE_SIGNING_KEY_SECRET }}
      KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET: ${{ vars.KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET }}
      KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET: ${{ vars.KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET }}
      KVITBIT_ENABLE_TURBO_CACHE: ${{ vars.KVITBIT_ENABLE_TURBO_CACHE }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      KVITBIT_EDGE_DOMAINS: ${{ vars.KVITBIT_EDGE_DOMAINS }}
      KVITBIT_EMAIL_MODE: ${{ vars.KVITBIT_EMAIL_MODE }}
      KVITBIT_BLOB_DRIVER: ${{ vars.KVITBIT_BLOB_DRIVER }}
      KVITBIT_BOT_PROTECTION_MODE: ${{ vars.KVITBIT_BOT_PROTECTION_MODE }}
      KVITBIT_ENV: ${{ vars.KVITBIT_ENV }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate GCP deployment variables
        env:
          KVITBIT_REPO_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          bun infra/alchemy/src/preflight-cli.ts

      # Step 1: Federated credentials file for gcloud and Artifact Registry Docker push.
      - name: Authenticate to Google Cloud (OIDC)
        if: env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # Step 2: Alchemy 2.0.0-beta.87 reads GOOGLE_ACCESS_TOKEN + GOOGLE_PROJECT_ID
      # rather than external_account federated credential files.
      - name: Mint Alchemy OAuth access token
        id: alchemy-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Set up gcloud
        if: env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        uses: google-github-actions/setup-gcloud@v3

      # Guard against accidentally running foundation-only bootstrap on a populated production
      # environment (in addition to the in-stack Alchemy state guard in alchemy.run.ts).
      - name: Guard bootstrap against populated production workloads
        if: env.BOOTSTRAP_FOUNDATION == 'true'
        run: |
          set -euo pipefail
          SERVICE_NAME="kvitbit-${KVITBIT_STAGE}-server"
          if gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" >/dev/null 2>&1; then
            echo "::error::Refusing bootstrap_foundation=true: Cloud Run service '${SERVICE_NAME}' already exists in ${GCP_PROJECT_ID}/${GCP_REGION}. Run a normal deploy instead."
            exit 1
          fi
          EXISTING_RUNNERS="$(gcloud compute instances list \
            --project "$GCP_PROJECT_ID" \
            --zones "$GCP_ZONE" \
            --filter="labels.app=kvitbit AND labels.stage=${KVITBIT_STAGE} AND labels.workload=runner" \
            --format='value(name)' 2>/dev/null || true)"
          if [ -n "$EXISTING_RUNNERS" ]; then
            echo "::error::Refusing bootstrap_foundation=true: runner instance(s) already exist (${EXISTING_RUNNERS}). Run a normal deploy instead."
            exit 1
          fi

      # Fail fast before pushing images or running migrations if foundation resources
      # or required Secret Manager versions have not been bootstrapped yet.
      - name: Preflight Artifact Registry and Secret Manager versions
        if: env.DRY_RUN != 'true' && env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        run: |
          set -euo pipefail
          if ! gcloud artifacts repositories describe kvitbit \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" >/dev/null 2>&1; then
            echo "::error::Artifact Registry repository 'kvitbit' does not exist in ${GCP_PROJECT_ID}/${GCP_REGION}. Run this workflow once with bootstrap_foundation=true first."
            exit 1
          fi

          required_secrets="kvitbit-${KVITBIT_STAGE}-database-url kvitbit-${KVITBIT_STAGE}-runner-database-url-unpooled kvitbit-${KVITBIT_STAGE}-better-auth-secret"
          resend_secret="kvitbit-${KVITBIT_STAGE}-resend-api-key"
          if [ "${KVITBIT_ENABLE_RESEND_SECRET:-false}" = "true" ]; then
            required_secrets="${required_secrets} ${resend_secret}"
          fi
          if [ "${KVITBIT_ENABLE_SMTP_SECRET:-false}" = "true" ]; then
            required_secrets="${required_secrets} kvitbit-${KVITBIT_STAGE}-smtp-url"
          fi
          if [ "${KVITBIT_ENABLE_MOBILE_SIGNING_KEY_SECRET:-false}" = "true" ]; then
            required_secrets="${required_secrets} kvitbit-${KVITBIT_STAGE}-mobile-updates-signing-key"
          fi
          feedback_secret="kvitbit-${KVITBIT_STAGE}-feedback-github-token"
          if [ "${KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET:-false}" = "true" ]; then
            required_secrets="${required_secrets} ${feedback_secret}"
          fi
          altcha_secret="kvitbit-${KVITBIT_STAGE}-altcha-hmac-key"
          if [ "${KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET:-false}" = "true" ]; then
            required_secrets="${required_secrets} ${altcha_secret}"
          fi
          turbo_cache_secret="kvitbit-${KVITBIT_STAGE}-turbo-cache-token"
          if [ "${KVITBIT_ENABLE_TURBO_CACHE:-false}" = "true" ]; then
            required_secrets="${required_secrets} ${turbo_cache_secret}"
          fi

          for secret_id in $required_secrets; do
            state="$(gcloud secrets versions describe latest \
              --project "$GCP_PROJECT_ID" \
              --secret "$secret_id" \
              --format='value(state)' 2>/dev/null || true)"
            if [ "$state" != "ENABLED" ]; then
              if [ "$secret_id" = "$feedback_secret" ]; then
                echo "::error::Secret Manager secret '${secret_id}' does not have an ENABLED 'latest' version (got '${state:-missing}'). Run bootstrap_feedback_secret=true if the container is missing, then add an enabled token version before deploying."
              elif [ "$secret_id" = "$altcha_secret" ]; then
                echo "::error::Secret Manager secret '${secret_id}' does not have an ENABLED 'latest' version (got '${state:-missing}'). Run bootstrap_altcha_secret=true if the container is missing, then add an enabled ALTCHA HMAC key version before deploying."
              elif [ "$secret_id" = "$resend_secret" ]; then
                echo "::error::Secret Manager secret '${secret_id}' does not have an ENABLED 'latest' version (got '${state:-missing}'). Run bootstrap_resend_secret=true if the container is missing, then add an enabled API key version before deploying."
              elif [ "$secret_id" = "$turbo_cache_secret" ]; then
                echo "::error::Secret Manager secret '${secret_id}' does not have an ENABLED 'latest' version (got '${state:-missing}'). Run bootstrap_turbo_cache_secret=true if the container is missing, then add an enabled token version before deploying."
              else
                echo "::error::Secret Manager secret '${secret_id}' does not have an ENABLED 'latest' version (got '${state:-missing}'). Run bootstrap_foundation=true if needed and populate secret versions before deploying."
              fi
              exit 1
            fi
          done

      - name: Configure Docker for Artifact Registry
        if: env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up Blacksmith Docker Builder
        if: env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile

      - name: Build and push Kvitbit OCI image
        id: image
        if: env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        run: |
          set -euo pipefail
          IMAGE_REPO="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/kvitbit/kvitbit"
          # Attempt-specific tag avoids immutableTags collisions on workflow retries;
          # workloads always deploy by resolved @sha256 digest.
          IMAGE_TAG="sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker buildx build \
            --file Dockerfile \
            --load \
            --tag "${IMAGE_REPO}:${IMAGE_TAG}" \
            .

          if [ "$DRY_RUN" = "true" ]; then
            DIGEST="sha256:$(printf '%s' "${GITHUB_SHA}" | sha256sum | awk '{print $1}')"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "Dry run: skipped docker push (synthetic plan digest ${DIGEST})"
          else
            docker push "${IMAGE_REPO}:${IMAGE_TAG}"
            DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REPO}:${IMAGE_TAG}" | awk -F'@' '{print $2}')"
            if [ -z "$DIGEST" ]; then
              echo "::error::Failed to resolve immutable image digest after push"
              exit 1
            fi
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # Explicit migration step BEFORE Cloud Run / runner pool rollout (rule S5, #878).
      - name: Run database and cluster schema migrations
        if: env.DRY_RUN != 'true' && env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_DIRECT_URL secret must be set for migrations"
            exit 1
          fi
          if [ ! -f apps/server/src/migrate.ts ]; then
            echo "::error::apps/server/src/migrate.ts is missing; cannot run production migrations"
            exit 1
          fi
          bun apps/server/src/migrate.ts

      - name: Run pure-Alchemy GCP stack (${{ inputs.dry_run && 'plan' || inputs.bootstrap_feedback_secret && 'feedback secret bootstrap' || inputs.bootstrap_altcha_secret && 'ALTCHA secret bootstrap' || inputs.bootstrap_resend_secret && 'resend secret bootstrap' || inputs.bootstrap_turbo_cache_secret && 'turbo cache secret bootstrap' || inputs.bootstrap_foundation && 'foundation bootstrap' || 'deploy' }})
        working-directory: infra/alchemy
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.alchemy-auth.outputs.access_token }}
          GOOGLE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          KVITBIT_STAGE: ${{ env.KVITBIT_STAGE }}
          KVITBIT_ENV: ${{ env.KVITBIT_ENV }}
          KVITBIT_BOOTSTRAP_FOUNDATION: ${{ env.BOOTSTRAP_FOUNDATION }}
          KVITBIT_BOOTSTRAP_FEEDBACK_SECRET: ${{ env.BOOTSTRAP_FEEDBACK_SECRET }}
          KVITBIT_BOOTSTRAP_ALTCHA_SECRET: ${{ env.BOOTSTRAP_ALTCHA_SECRET }}
          KVITBIT_BOOTSTRAP_RESEND_SECRET: ${{ env.BOOTSTRAP_RESEND_SECRET }}
          KVITBIT_BOOTSTRAP_TURBO_CACHE_SECRET: ${{ env.BOOTSTRAP_TURBO_CACHE_SECRET }}
          KVITBIT_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          KVITBIT_GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          KVITBIT_GCP_REGION: ${{ vars.GCP_REGION }}
          KVITBIT_GCP_ZONE: ${{ vars.GCP_ZONE }}
          KVITBIT_ALCHEMY_STATE_BUCKET: ${{ vars.ALCHEMY_STATE_BUCKET }}
          KVITBIT_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          KVITBIT_APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          KVITBIT_EMAIL_MODE: ${{ env.KVITBIT_EMAIL_MODE }}
          KVITBIT_EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          KVITBIT_BLOB_DRIVER: ${{ env.KVITBIT_BLOB_DRIVER }}
          KVITBIT_BOT_PROTECTION_MODE: ${{ env.KVITBIT_BOT_PROTECTION_MODE }}
          KVITBIT_ALERT_EMAIL: ${{ vars.KVITBIT_ALERT_EMAIL }}
          KVITBIT_POSTHOG_KEY: ${{ vars.KVITBIT_POSTHOG_KEY }}
          KVITBIT_POSTHOG_HOST: ${{ vars.KVITBIT_POSTHOG_HOST }}
          KVITBIT_EDGE_DOMAINS: ${{ vars.KVITBIT_EDGE_DOMAINS }}
          KVITBIT_DNS_ZONES: ${{ vars.KVITBIT_DNS_ZONES }}
          KVITBIT_RUNNER_COUNT: ${{ vars.KVITBIT_RUNNER_COUNT }}
          KVITBIT_ANDROID_ASSETLINKS_SHA256: ${{ vars.KVITBIT_ANDROID_ASSETLINKS_SHA256 }}
          KVITBIT_ENABLE_RESEND_SECRET: ${{ env.KVITBIT_ENABLE_RESEND_SECRET }}
          KVITBIT_ENABLE_SMTP_SECRET: ${{ env.KVITBIT_ENABLE_SMTP_SECRET }}
          KVITBIT_ENABLE_MOBILE_SIGNING_KEY_SECRET: ${{ env.KVITBIT_ENABLE_MOBILE_SIGNING_KEY_SECRET }}
          KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET: ${{ env.KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET }}
          KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET: ${{ env.KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET }}
          KVITBIT_ENABLE_TURBO_CACHE: ${{ env.KVITBIT_ENABLE_TURBO_CACHE }}
          KVITBIT_TURBO_CACHE_BUCKET: ${{ vars.KVITBIT_TURBO_CACHE_BUCKET }}
          KVITBIT_TURBO_CACHE_IMAGE: ${{ vars.KVITBIT_TURBO_CACHE_IMAGE }}
          KVITBIT_TURBO_CACHE_TTL_DAYS: ${{ vars.KVITBIT_TURBO_CACHE_TTL_DAYS }}
          KVITBIT_TURBO_CACHE_MAX_INSTANCES: ${{ vars.KVITBIT_TURBO_CACHE_MAX_INSTANCES }}
          KVITBIT_FEEDBACK_GITHUB_REPO: ${{ vars.KVITBIT_FEEDBACK_GITHUB_REPO }}
          KVITBIT_FEEDBACK_OWNER_EMAILS: ${{ vars.KVITBIT_FEEDBACK_OWNER_EMAILS }}
          KVITBIT_MAIL_DOMAIN: ${{ vars.KVITBIT_MAIL_DOMAIN }}
          KVITBIT_MAIL_MX_HOST: ${{ vars.KVITBIT_MAIL_MX_HOST }}
          KVITBIT_MAIL_FORWARD_TO: ${{ vars.KVITBIT_MAIL_FORWARD_TO }}
          KVITBIT_MAIL_FORWARD_FROM: ${{ vars.KVITBIT_MAIL_FORWARD_FROM }}
          KVITBIT_MAIL_ALIASES: ${{ vars.KVITBIT_MAIL_ALIASES }}
          KVITBIT_MAIL_REGION: ${{ vars.KVITBIT_MAIL_REGION }}
          KVITBIT_MAIL_ZONE: ${{ vars.KVITBIT_MAIL_ZONE }}
          KVITBIT_MAIL_CIDR: ${{ vars.KVITBIT_MAIL_CIDR }}
          KVITBIT_MAIL_ARCHIVE_BUCKET: ${{ vars.KVITBIT_MAIL_ARCHIVE_BUCKET }}
          KVITBIT_MAIL_RESEND_DKIM_TXT: ${{ vars.KVITBIT_MAIL_RESEND_DKIM_TXT }}
          KVITBIT_MAIL_RESEND_SEND_MX: ${{ vars.KVITBIT_MAIL_RESEND_SEND_MX }}
          KVITBIT_MAIL_RESEND_SEND_SPF_TXT: ${{ vars.KVITBIT_MAIL_RESEND_SEND_SPF_TXT }}
          KVITBIT_MAIL_APEX_SPF_TXT: ${{ vars.KVITBIT_MAIL_APEX_SPF_TXT }}
          KVITBIT_MAIL_DMARC_TXT: ${{ vars.KVITBIT_MAIL_DMARC_TXT }}
        run: |
          set -euo pipefail
          selection=()
          if [ "${BOOTSTRAP_FEEDBACK_SECRET:-false}" = "true" ]; then
            if [ "${KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET:-false}" != "true" ]; then
              echo "::error::Set the KVITBIT_ENABLE_FEEDBACK_GITHUB_TOKEN_SECRET repository variable to true before bootstrapping the feedback token container."
              exit 1
            fi
            # Alchemy evaluates the stack config before selecting the one secret.
            KVITBIT_IMAGE_DIGEST="sha256:$(printf '%s' "$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            export KVITBIT_IMAGE_DIGEST
            selection=(--include "Secret-kvitbit-${KVITBIT_STAGE}-feedback-github-token")
          elif [ "${BOOTSTRAP_ALTCHA_SECRET:-false}" = "true" ]; then
            if [ "${KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET:-false}" != "true" ]; then
              echo "::error::Set the KVITBIT_ENABLE_ALTCHA_HMAC_KEY_SECRET repository variable to true before bootstrapping the ALTCHA HMAC key container."
              exit 1
            fi
            # Alchemy evaluates the stack config before selecting the one secret.
            KVITBIT_IMAGE_DIGEST="sha256:$(printf '%s' "$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            export KVITBIT_IMAGE_DIGEST
            selection=(--include "Secret-kvitbit-${KVITBIT_STAGE}-altcha-hmac-key")
          elif [ "${BOOTSTRAP_RESEND_SECRET:-false}" = "true" ]; then
            if [ "${KVITBIT_ENABLE_RESEND_SECRET:-false}" != "true" ]; then
              echo "::error::Set the KVITBIT_ENABLE_RESEND_SECRET repository variable to true before bootstrapping the Resend API key container."
              exit 1
            fi
            KVITBIT_IMAGE_DIGEST="sha256:$(printf '%s' "$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            export KVITBIT_IMAGE_DIGEST
            selection=(--include "Secret-kvitbit-${KVITBIT_STAGE}-resend-api-key")
          elif [ "${BOOTSTRAP_TURBO_CACHE_SECRET:-false}" = "true" ]; then
            if [ "${KVITBIT_ENABLE_TURBO_CACHE:-false}" != "true" ]; then
              echo "::error::Set the KVITBIT_ENABLE_TURBO_CACHE repository variable to true before bootstrapping the Turborepo cache token container."
              exit 1
            fi
            KVITBIT_IMAGE_DIGEST="sha256:$(printf '%s' "$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            export KVITBIT_IMAGE_DIGEST
            selection=(--include "Secret-kvitbit-${KVITBIT_STAGE}-turbo-cache-token")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            bunx alchemy plan --stage "$KVITBIT_STAGE" "${selection[@]}"
          else
            bunx alchemy deploy --yes --stage "$KVITBIT_STAGE" "${selection[@]}"
          fi

      - name: Sync Turborepo remote cache bucket lifecycle
        if: env.DRY_RUN != 'true' && env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true' && env.KVITBIT_ENABLE_TURBO_CACHE == 'true'
        env:
          KVITBIT_TURBO_CACHE_BUCKET: ${{ vars.KVITBIT_TURBO_CACHE_BUCKET }}
          KVITBIT_TURBO_CACHE_TTL_DAYS: ${{ vars.KVITBIT_TURBO_CACHE_TTL_DAYS }}
        run: |
          set -euo pipefail
          bucket="${KVITBIT_TURBO_CACHE_BUCKET:-${GCP_PROJECT_ID}-turbo-cache-${KVITBIT_STAGE}}"
          ttl_days="${KVITBIT_TURBO_CACHE_TTL_DAYS:-30}"
          lifecycle_file="$(mktemp)"
          trap 'rm -f "$lifecycle_file"' EXIT
          printf '{"rule":[{"action":{"type":"Delete"},"condition":{"age":%s}}]}\n' "$ttl_days" > "$lifecycle_file"
          gcloud storage buckets update "gs://${bucket}" \
            --project "$GCP_PROJECT_ID" \
            --lifecycle-file="$lifecycle_file" \
            --quiet

      - name: Verify runner pool reconciled target digest and config
        if: env.DRY_RUN != 'true' && env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        env:
          TARGET_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          RUNNERS="$(gcloud compute instances list \
            --project "$GCP_PROJECT_ID" \
            --zones "$GCP_ZONE" \
            --filter="labels.app=kvitbit AND labels.stage=${KVITBIT_STAGE} AND labels.workload=runner" \
            --format='value(name)')"
          if [ -z "$RUNNERS" ]; then
            echo "::error::No Kvitbit runner instances found in ${GCP_PROJECT_ID}/${GCP_ZONE}"
            exit 1
          fi

          poll_runner_convergence() {
            local runner="$1"
            local expected_config_sha="$2"
            local max_attempts="$3"
            local expected_target="${TARGET_DIGEST}|${expected_config_sha}"
            for attempt in $(seq 1 "$max_attempts"); do
              # This single value binds the digest and config SHA to the same verified worker.
              active_target="$(gcloud compute instances get-guest-attributes "$runner" \
                --project "$GCP_PROJECT_ID" \
                --zone "$GCP_ZONE" \
                --query-path="kvitbit/active-target" \
                --format='value(value)' 2>/dev/null || true)"
              if [ "$active_target" = "$expected_target" ]; then
                echo "Verified runner ${runner} is running digest=${TARGET_DIGEST} config=${expected_config_sha}"
                return 0
              fi
              echo "Waiting for runner ${runner} (attempt ${attempt}/${max_attempts}, observed target=${active_target:-none})"
              sleep 10
            done
            return 1
          }

          for runner in $RUNNERS; do
            metadata_json="$(gcloud compute instances describe "$runner" \
              --project "$GCP_PROJECT_ID" \
              --zone "$GCP_ZONE" \
              --format='json(metadata.items)')"
            expected_config_sha="$(printf '%s' "$metadata_json" | bun -e '
              const data = JSON.parse(await new Response(Bun.stdin.stream()).text());
              const items = data?.metadata?.items ?? [];
              const hit = items.find((item) => item?.key === "kvitbit-worker-config-sha");
              process.stdout.write(typeof hit?.value === "string" ? hit.value : "");
            ')"
            if [ -z "$expected_config_sha" ]; then
              echo "::error::Runner ${runner} is missing kvitbit-worker-config-sha instance metadata"
              exit 1
            fi

            if ! poll_runner_convergence "$runner" "$expected_config_sha" 12; then
              echo "Runner ${runner} did not report the verified target via timer. Resetting the instance once to apply the current startup script."
              gcloud compute instances reset "$runner" \
                --project "$GCP_PROJECT_ID" \
                --zone "$GCP_ZONE" \
                --quiet
              if ! poll_runner_convergence "$runner" "$expected_config_sha" 18; then
                echo "::error::Runner ${runner} did not reconcile target digest ${TARGET_DIGEST} and config ${expected_config_sha} in time"
                exit 1
              fi
            fi
          done

      - name: Verify inbound mail forwarder reconciled target config and script
        if: env.DRY_RUN != 'true' && env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true' && vars.KVITBIT_MAIL_DOMAIN != ''
        env:
          KVITBIT_MAIL_ZONE: ${{ vars.KVITBIT_MAIL_ZONE }}
        run: |
          set -euo pipefail
          MAIL_ZONE="${KVITBIT_MAIL_ZONE:-us-east1-b}"
          MAIL_INSTANCE="kvitbit-${KVITBIT_STAGE}-mail-ingress"
          metadata_json="$(gcloud compute instances describe "$MAIL_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$MAIL_ZONE" \
            --format='json(metadata.items)')"
          expected_target="$(printf '%s' "$metadata_json" | bun -e '
            const data = JSON.parse(await new Response(Bun.stdin.stream()).text());
            const items = data?.metadata?.items ?? [];
            const get = (k) => items.find((item) => item?.key === k)?.value ?? "";
            const d = get("kvitbit-mail-image-digest");
            const c = get("kvitbit-mail-config-sha");
            const s = get("kvitbit-mail-script-sha");
            if (d && c && s) process.stdout.write(`${d}|${c}|${s}`);
          ')"
          if [ -z "$expected_target" ]; then
            echo "::error::Mail forwarder ${MAIL_INSTANCE} is missing expected metadata hashes"
            exit 1
          fi
          for attempt in $(seq 1 18); do
            active_target="$(gcloud compute instances get-guest-attributes "$MAIL_INSTANCE" \
              --project "$GCP_PROJECT_ID" \
              --zone "$MAIL_ZONE" \
              --query-path="kvitbit/mail-active-target" \
              --format='value(value)' 2>/dev/null || true)"
            if [ "$active_target" = "$expected_target" ]; then
              echo "Verified ${MAIL_INSTANCE} reconciled target ${expected_target}"
              exit 0
            fi
            echo "Waiting for ${MAIL_INSTANCE} (attempt ${attempt}/18, observed=${active_target:-none})"
            sleep 10
          done
          echo "::error::Mail forwarder ${MAIL_INSTANCE} did not reconcile target ${expected_target} in time"
          exit 1

      - name: Verify database readiness and static mounts
        if: env.DRY_RUN != 'true' && env.BOOTSTRAP_FOUNDATION != 'true' && env.BOOTSTRAP_FEEDBACK_SECRET != 'true' && env.BOOTSTRAP_ALTCHA_SECRET != 'true' && env.BOOTSTRAP_RESEND_SECRET != 'true' && env.BOOTSTRAP_TURBO_CACHE_SECRET != 'true'
        env:
          KVITBIT_EDGE_DOMAINS: ${{ vars.KVITBIT_EDGE_DOMAINS }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -n "${KVITBIT_EDGE_DOMAINS:-}" ]; then
            if [ -n "${APP_ORIGIN:-}" ]; then
              PROBE_URL="${APP_ORIGIN%/}"
            else
              FIRST_DOMAIN="$(printf '%s' "$KVITBIT_EDGE_DOMAINS" | cut -d',' -f1 | tr -d '[:space:]')"
              PROBE_URL="https://${FIRST_DOMAIN}"
            fi
          else
            SERVICE_NAME="kvitbit-${KVITBIT_STAGE}-server"
            PROBE_URL="$(gcloud run services describe "$SERVICE_NAME" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='value(status.url)')"
          fi
          if [ -z "$PROBE_URL" ]; then
            echo "::error::Could not resolve probe URL"
            exit 1
          fi

          # The Cloud Run frontend intercepts /healthz on *.run.app.
          # The container startup and liveness probes still use that path.
          probe() {
            local path="$1" content_type="$2" output="${3:-/dev/null}" response
            response="$(curl -fsS --retry 6 --retry-delay 5 --output "$output" \
              --write-out '%{http_code} %{content_type}' "${PROBE_URL}${path}")"
            if [ "${response%%;*}" != "200 ${content_type}" ]; then
              echo "::error::${path} returned '${response}', expected HTTP 200 with ${content_type}"
              return 1
            fi
          }

          readiness_body="$(mktemp)"
          trap 'rm -f "$readiness_body"' EXIT
          probe /readyz application/json "$readiness_body"
          if ! jq -e '.status == "ok"' "$readiness_body" > /dev/null; then
            echo "::error::/readyz did not report status ok"
            exit 1
          fi
          probe / text/html
          probe /app/manifest.webmanifest application/manifest+json
          echo "Verified database readiness and static mounts at ${PROBE_URL}"
